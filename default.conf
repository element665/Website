server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Hidden files (.git, .env, .DS_Store, ...). Listed first so no later regex location can claim them.
  location ~ /\.(?!well-known) {
    deny all;
  }

  # --- Security headers ---
  #
  # IMPORTANT: nginx only inherits add_header from this level into a location block if that
  # location has NO add_header of its own. So never use add_header inside a location below;
  # it would silently drop every header in this section for that location. Cache policy
  # therefore uses `expires`, which does not have this problem.
  #
  # Keep each header on ONE line. A multi-line value is sent with embedded newlines.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # frame-src must list every host the pages embed in an <iframe> (Vimeo, YouTube).
  # scripts/smoke-test.sh checks this against the iframes in site/*.html on every build.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://player.vimeo.com https://www.youtube-nocookie.com; upgrade-insecure-requests" always;

  # HSTS: the site is only ever reached over HTTPS (Cloudflare terminates TLS).
  # includeSubDomains / preload are deliberately omitted: they would apply to every subdomain of
  # the domain (including internal ones) in a visitor's browser for a year and are hard to undo.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # --- Compression (Cloudflare often does this at the edge, but origin gzip is still fine) ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

  # --- Caching policy ---
  # HTML: always revalidate (Cache-Control: no-cache). Updates show up immediately and
  # unchanged pages still cost only a 304 thanks to the ETag.
  location ~* \.html$ {
    expires -1;
  }

  # CSS/JS: filenames are not content-hashed, so keep the TTL short or an edited
  # styles.css would stay stale in browsers and on Cloudflare's edge.
  location ~* \.(?:css|js|mjs)$ {
    expires 1h;
  }

  # Images and fonts: long TTL, but not `immutable`, because a file may be replaced under the same name.
  location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
    expires 30d;
  }

  # Default routing (no SPA behavior here; just serve files)
  location / {
    try_files $uri $uri/ =404;
  }
}

# Internal metrics for the nginx-prometheus-exporter container (see docker/docker-compose.yaml).
# Port 8080 is never published to the host and the Cloudflare tunnel only forwards to :80, so this
# is reachable only from other containers on the compose network. Keep stub_status OUT of the :80
# server above: scripts/smoke-test.sh fails the build if /stub_status ever answers on the public port.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log off;

  location = /stub_status {
    stub_status;
  }

  location / {
    return 404;
  }
}
