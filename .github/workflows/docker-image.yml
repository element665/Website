name: Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'site/**'
      - 'Dockerfile'
      - 'default.conf'
      - 'scripts/**'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'site/**'
      - 'Dockerfile'
      - 'default.conf'
      - 'scripts/**'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer PR push cancels the older PR run, but a deploy on main is never cancelled midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: website:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name site-test -p 127.0.0.1:8080:80 website:test
          sh scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Internal metrics endpoint (stub_status) works
        run: docker exec site-test wget -qO- http://127.0.0.1:8080/stub_status | grep -q "Active connections"

      - name: Compose file is valid and third-party images exist
        run: |
          cp docker/tunnel.env.example docker/tunnel.env
          cd docker
          docker compose config -q
          docker compose pull nginx-exporter cloudflared

      - name: Container logs (on failure)
        if: failure()
        run: docker logs site-test || true

      # Everything below runs only for pushes to main (and manual runs on main). Pull requests stop above.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (tagged with the commit SHA and latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            element665/website:${{ github.sha }}
            element665/website:latest
          cache-from: type=gha

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Authenticates with an OAuth client instead of an auth key: OAuth clients do not expire every
      # 90 days. The runner joins as an ephemeral node tagged tag:ci, so the tailnet ACL decides what
      # it can reach (it should be allowed to reach the web VM on port 22 and nothing else).
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to web server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd /home/webadmin/Website

            # Put the server's checkout on the exact commit being deployed, so docker-compose.yaml
            # always matches the image. Hand edits to tracked files are discarded; untracked and
            # git-ignored files (.env, tunnel.env) are not touched by reset --hard.
            if ! git fetch --quiet origin main; then
              echo "git fetch failed. On the server, 'git remote -v' in /home/webadmin/Website must show a reachable (https) remote." >&2
              exit 1
            fi
            git reset --hard "${IMAGE_TAG}"
            cd docker

            # Remember what is running now so we can go back to it.
            PREV=$(sed -n 's/^IMAGE_TAG=//p' .env 2>/dev/null || true)

            # Pull first. IMAGE_TAG is already in this shell's environment and compose gives the
            # environment priority over .env, so this fetches the new image. If the pull fails,
            # nothing on the server has changed yet.
            docker compose pull

            echo "IMAGE_TAG=${IMAGE_TAG}" > .env
            if docker compose up -d --wait; then
              echo "Deployed ${IMAGE_TAG}"
              # keep the last week of images around for quick rollbacks, drop the rest
              docker image prune -af --filter "until=168h"
            else
              echo "Health check failed for ${IMAGE_TAG}" >&2
              if [ -n "${PREV}" ] && [ "${PREV}" != "${IMAGE_TAG}" ]; then
                echo "Rolling back to ${PREV}" >&2
                echo "IMAGE_TAG=${PREV}" > .env
                # IMAGE_TAG must be overridden here: the new value is still exported in this shell
                # and would otherwise win over the .env file, "rolling back" to the same bad image.
                IMAGE_TAG="${PREV}" docker compose up -d --wait || true
              fi
              exit 1
            fi
