services:
  site:
    container_name: site
    # CI writes IMAGE_TAG=<git sha> to .env next to this file on every deploy.
    # To roll back by hand: set IMAGE_TAG in .env to an older SHA and run `docker compose up -d`.
    image: element665/website:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No published port on purpose: nginx is only reachable by other containers on this
    # compose network (cloudflared), not from the LAN.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:2026.10.7
    # tunnel.env lives on the server only (git-ignored) and holds TUNNEL_TOKEN=... (see tunnel.env.example).
    # In the Cloudflare Zero Trust dashboard, the tunnel's public hostname must point at http://site:80
    env_file: tunnel.env
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Prometheus scrapes http://<this-vm>:2000/metrics. Docker-published ports bypass the host's
    # INPUT firewall rules; see monitoring/README.md for how to restrict who can reach them.
    ports:
      - "2000:2000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-exporter:
    container_name: nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.5.3
    # Reads nginx's internal stub_status (port 8080: not published, not routed by the tunnel) and
    # serves Prometheus metrics on :9113. No healthcheck: this image is minimal and may have no shell.
    command: --nginx.scrape-uri=http://site:8080/stub_status
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    ports:
      - "9113:9113"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
